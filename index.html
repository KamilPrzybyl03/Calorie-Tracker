<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Calorie Estimator</h1>
    
    <div id="loginForm">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="button" onclick="login()">Login</button>
    </div>

    <div id="registerForm">
        <h2>Register</h2>
        <input type="text" id="registerUsername" placeholder="Username" required>
        <input type="password" id="registerPassword" placeholder="Password" required>
        <button type="button" onclick="register()">Register</button>
    </div>

    <input type="file" id="imageInput" accept="image/*" capture="camera">
    <button onclick="analyzeImage()">Analyze Food Image</button>
    <p id="result"></p>
    <a href="help.html" class="button">help</a>
    <div class="container">
        <h1>Calorie Tracker</h1>
    

        <h2>Todays Net Calories: <span id="netCalories">0</span></h2>
    
        <div class="section">
            <h2>Food Intake</h2>
            <div class="input-group">
                <label for="foodName">Food Name:</label>
                <input type="text" id="foodName">
            </div>
            <div class="input-group">
                <label for="foodCalories">Calories:</label>
                <input type="number" id="foodCalories">
            </div>
            <button type="button" onclick="addFood()">Add Food</button>
            <ul id="foodList"></ul>
        </div>
    
        <div class="section">
            <h2>Workouts</h2>
            <div class="input-group">
                <label for="workoutName">Workout Name:</label>
                <input type="text" id="workoutName">
            </div>
            <div class="input-group">
                <label for="workoutCalories">Calories Burned:</label>
                <input type="number" id="workoutCalories">
            </div>
            <button type="button" onclick="addWorkout()">Add Workout</button>
            <ul id="workoutList"></ul>
        </div>
    </div>    
</body>
</html>
