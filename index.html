<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Tracker</title>
    <link rel="stylesheet" href="styles.css">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="blacklist.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <header class="header">
        <h1>Calorie Tracker</h1>
        <div id="auth-buttons">
            <button onclick="togglePopup('loginPopup')">Login</button>
            <button onclick="togglePopup('registerPopup')">Register</button>
        </div>
        <div id="user-info" class="hidden">
            <button id="usernameButton" onclick="togglePopup('userPopup')"></button>
        </div>
    </header>

    <main class="container">
        <section class="left-panel">
            <h2>Log Calories</h2>
            <div class="input-group">
                <input type="text" id="foodName" placeholder="Food name">
                <input type="number" id="foodCalories" placeholder="Calories">
                <button onclick="addFood()">Add Food</button>
            </div>

            <div class="input-group">
                <input type="text" id="workoutName" placeholder="Workout name">
                <input type="number" id="workoutCalories" placeholder="Calories burned">
                <button onclick="addWorkout()">Add Workout</button>
            </div>

            <h2 style="margin-top: 40px;">Upload a Picture of Your Food</h2>
            <input type="file" id="imageInput">
            <button onclick="analyzeImage()">Analyze Image</button>
            <p id="result"></p>

            <h2 style="margin-top: 40px;">Today's Summary</h2>
            <p id="calorieText">Today's Calories: </p>
            <h3 id="netCalories">0</h3>

            <h3>Foods</h3>
            <ul id="foodList"></ul>

            <h3>Workouts</h3>
            <ul id="workoutList"></ul>
        </section>

        <section class="right-panel">
            <h2>Weekly Calorie Stats</h2>
            <canvas id="weeklyChart" width="400" height="200"></canvas>
        </section>
    </main>

    <section class="cookbook">
        <h2>My Cookbook</h2>
        <input type="text" id="recipeName" placeholder="Recipe name">
        <input type="number" id="recipeCalories" placeholder="Calories per person">
        <button onclick="addRecipe()">Save Recipe</button>
        <div id="recipeList"></div>
    </section>

    <div id="loginPopup" class="popup hidden">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <button onclick="togglePopup('loginPopup')">Close</button>
    </div>

    <div id="registerPopup" class="popup hidden">
        <h2>Register</h2>
        <input type="text" id="registerUsername" placeholder="Username">
        <input type="password" id="registerPassword" placeholder="Password">
        <button onclick="register()">Register</button>
        <button onclick="togglePopup('registerPopup')">Close</button>
    </div>

    <div id="userPopup" class="popup hidden">
        <button onclick="logout()">Logout</button>
        <button onclick="togglePopup('userPopup')">Close</button>
    </div>

	<div id="cookieConsent" class="cookie-banner hidden">
  		<span>This site uses cookies to enhance your experience.</span>
  		<button onclick="acceptCookies()">I Understand</button>
	</div>

    <script src="blacklist.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
